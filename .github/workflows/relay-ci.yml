name: Relay CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/relay

jobs:
  test:
    name: Test
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: apps/relay/go.sum

      - name: Test
        run: make test

  audit:
    name: Audit
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: apps/relay/go.sum

      - name: Audit
        run: make audit
